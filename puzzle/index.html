<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>九宫格拼图</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>九宫格拼图</h1>
      <div class="meta">
        <span id="levelLabel">关卡：- / -</span>
        <span id="moveLabel">步数：0</span>
      </div>
    </header>

    <section class="panel">
      <div id="board" class="board" aria-label="拼图棋盘"></div>
    </section>

    <section class="controls">
      <button id="prevBtn" type="button">上一关</button>
      <button id="shuffleBtn" type="button">重新打乱</button>
      <button id="nextBtn" type="button">下一关</button>
    </section>

    <p id="status" class="status">加载中...</p>
  </main>

  <script src="./levels.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
