<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Clean</title>
  <link rel="stylesheet" href="style.css?v=20260702a" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Match Clean</h1>
      <div class="stats">
        <div class="stat stat-time">
          <span class="label">Time</span>
          <div class="time-track" role="progressbar" aria-label="time left" aria-valuemin="0" aria-valuemax="30" aria-valuenow="30">
            <div id="timeBar" class="time-fill"></div>
          </div>
          <span id="timeText" class="value">30s</span>
        </div>
        <div class="stat">
          <span class="label">Score</span>
          <span id="scoreText" class="value">0</span>
        </div>
      </div>
      <div id="message" class="message">Game running...</div>
      <button id="restartBtn" type="button">Restart</button>
    </section>

    <section class="board-wrap">
      <div id="board" class="board" aria-label="game board"></div>
    </section>
  </main>

  <div id="gameModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText" hidden>
    <div class="modal-card">
      <h2 id="modalTitle">Game Over</h2>
      <p id="modalText">Time is up.</p>
      <button id="modalReplayBtn" type="button">Replay</button>
    </div>
  </div>

  <script src="script.js?v=20260702a"></script>
</body>
</html>
