<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>泡泡龙 - Bubble Pop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a2e;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}
#game-container {
  position: relative;
  width: 480px; max-width: 100vw;
  aspect-ratio: 9/16; max-height: 100vh;
}
canvas {
  display: block; width: 100%; height: 100%;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(100,100,255,0.3);
}
#ui-overlay {
  position: absolute; top: 0; left: 0; right: 0;
  pointer-events: none;
  padding: 10px 16px;
  display: flex; justify-content: space-between;
  align-items: flex-start;
}
.ui-box {
  background: rgba(0,0,0,0.85);
  border-radius: 10px; padding: 6px 12px;
  color: #fff; font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px;
  backdrop-filter: blur(6px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.ui-box .label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }
.ui-box .value { font-size: 18px; line-height: 1.2; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="ui-overlay">
    <div class="ui-box"><div class="label">关卡</div><div class="value" id="ui-level">1</div></div>
    <div class="ui-box"><div class="label">分数</div><div class="value" id="ui-score">0</div></div>
    <div class="ui-box"><div class="label">连击</div><div class="value" id="ui-combo">0</div></div>
    <div class="ui-box"><div class="label">剩余</div><div class="value" id="ui-remain">0</div></div>
  </div>
</div>

<script src="bubble-pop.js"></script>
</body>
</html>
