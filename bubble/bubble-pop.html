<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>泡泡龙 - Bubble Pop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a2e;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}
#game-container {
  position: relative;
  width: 480px; max-width: 100vw;
  aspect-ratio: 9/16; max-height: 100vh;
}
canvas {
  display: block; width: 100%; height: 100%;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(100,100,255,0.3);
}
#load-config-btn {
  position: absolute;
  right: 12px;
  bottom: 12px;
  border: 0;
  border-radius: 999px;
  background: rgba(9, 22, 50, 0.92);
  color: #fff;
  padding: 9px 14px;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
#reset-config-btn {
  position: absolute;
  right: 128px;
  bottom: 12px;
  border: 0;
  border-radius: 999px;
  background: rgba(42, 59, 102, 0.92);
  color: #fff;
  padding: 9px 14px;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
#loaded-config-name {
  position: absolute;
  left: 12px;
  bottom: 12px;
  max-width: 58%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 11px;
  color: rgba(255,255,255,0.75);
  background: rgba(0,0,0,0.35);
  padding: 6px 10px;
  border-radius: 999px;
}
#ui-overlay {
  position: absolute; top: 0; left: 0; right: 0;
  pointer-events: none;
  padding: 10px 16px;
  display: flex; justify-content: space-between;
  align-items: flex-start;
}
.ui-box {
  background: rgba(0,0,0,0.85);
  border-radius: 10px; padding: 6px 12px;
  color: #fff; font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px;
  backdrop-filter: blur(6px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.ui-box .label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }
.ui-box .value { font-size: 18px; line-height: 1.2; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="ui-overlay">
    <div class="ui-box"><div class="label">关卡</div><div class="value" id="ui-level">1</div></div>
    <div class="ui-box"><div class="label">分数</div><div class="value" id="ui-score">0</div></div>
    <div class="ui-box"><div class="label">连击</div><div class="value" id="ui-combo">0</div></div>
    <div class="ui-box"><div class="label">剩余</div><div class="value" id="ui-remain">0</div></div>
  </div>
  <button id="reset-config-btn" type="button">恢复默认配置</button>
  <button id="load-config-btn" type="button">读取本地配置</button>
  <input id="local-config-input" type="file" accept="application/json,.json" hidden>
  <div id="loaded-config-name">当前配置: game-config.json</div>
</div>

<script src="bubble-pop.js"></script>
</body>
</html>
