<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>泡泡龙 - Bubble Pop</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a2e;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
}
#game-container {
  position: relative;
  width: 480px; max-width: 100vw;
  aspect-ratio: 9/16; max-height: 100vh;
}
canvas {
  display: block; width: 100%; height: 100%;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(100,100,255,0.3);
}
#config-toggle {
  position: absolute;
  right: 14px;
  bottom: 14px;
  z-index: 20;
  border: 0;
  border-radius: 999px;
  background: rgba(12, 18, 56, 0.92);
  color: #fff;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.4px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.28);
}
#config-panel {
  position: absolute;
  inset: 56px 12px 12px 12px;
  z-index: 25;
  display: none;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border-radius: 14px;
  background: rgba(8, 12, 38, 0.96);
  color: #fff;
  box-shadow: 0 18px 48px rgba(0,0,0,0.45);
}
#config-panel.open { display: flex; }
#config-panel h2 {
  font-size: 18px;
  line-height: 1.2;
}
#config-panel p {
  font-size: 12px;
  line-height: 1.5;
  color: rgba(255,255,255,0.75);
}
#config-editor {
  flex: 1;
  width: 100%;
  min-height: 220px;
  resize: none;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 10px;
  padding: 12px;
  background: rgba(255,255,255,0.06);
  color: #dff6ff;
  font: 12px/1.5 Consolas, 'Courier New', monospace;
}
#config-status {
  min-height: 18px;
  font-size: 12px;
  color: #9ae6b4;
}
.config-actions {
  display: flex;
  gap: 8px;
}
.config-actions button {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 11px 12px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}
#config-apply { background: linear-gradient(180deg, #2fbf71, #208d54); }
#config-reset { background: linear-gradient(180deg, #4d7cff, #3258c9); }
#config-close { background: linear-gradient(180deg, #ff7b64, #da573f); }
#ui-overlay {
  position: absolute; top: 0; left: 0; right: 0;
  pointer-events: none;
  padding: 10px 16px;
  display: flex; justify-content: space-between;
  align-items: flex-start;
}
.ui-box {
  background: rgba(0,0,0,0.85);
  border-radius: 10px; padding: 6px 12px;
  color: #fff; font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px;
  backdrop-filter: blur(6px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.ui-box .label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }
.ui-box .value { font-size: 18px; line-height: 1.2; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="ui-overlay">
    <div class="ui-box"><div class="label">关卡</div><div class="value" id="ui-level">1</div></div>
    <div class="ui-box"><div class="label">分数</div><div class="value" id="ui-score">0</div></div>
    <div class="ui-box"><div class="label">连击</div><div class="value" id="ui-combo">0</div></div>
    <div class="ui-box"><div class="label">剩余</div><div class="value" id="ui-remain">0</div></div>
  </div>
  <button id="config-toggle" type="button">关卡配置</button>
  <div id="config-panel">
    <h2>网页关卡配置</h2>
    <p>直接修改下面的 JSON，点“应用配置”后会重置到菜单并按新配置重新生成关卡。</p>
    <textarea id="config-editor" spellcheck="false"></textarea>
    <div id="config-status"></div>
    <div class="config-actions">
      <button id="config-apply" type="button">应用配置</button>
      <button id="config-reset" type="button">恢复当前网页配置</button>
      <button id="config-close" type="button">关闭</button>
    </div>
  </div>
</div>

<script id="game-config" type="application/json">
{
  "levels": [
    { "name": "第一关 · 初识泡泡", "colors": 3, "pattern": "scattered", "rows": 4, "density": 0.25, "dropRate": 8, "targetScore": 300, "iceChance": 0.06, "vineChance": 0.04 },
    { "name": "第二关 · 渐入佳境", "colors": 3, "pattern": "scattered", "rows": 5, "density": 0.35, "dropRate": 7, "targetScore": 500, "iceChance": 0.07, "vineChance": 0.048 },
    { "name": "第三关 · 小小挑战", "colors": 4, "pattern": "rows", "rows": 5, "density": 1.0, "dropRate": 6, "targetScore": 800, "iceChance": 0.08, "vineChance": 0.056 },
    { "name": "第四关 · 三角阵列", "colors": 4, "pattern": "triangle", "rows": 6, "density": 1.0, "dropRate": 6, "targetScore": 1000, "iceChance": 0.09, "vineChance": 0.064 },
    { "name": "第五关 · 钻石之心", "colors": 4, "pattern": "diamond", "rows": 7, "density": 1.0, "dropRate": 5, "targetScore": 1200, "iceChance": 0.1, "vineChance": 0.072 },
    { "name": "第六关 · 环形包围", "colors": 5, "pattern": "ring", "rows": 7, "density": 1.0, "dropRate": 5, "targetScore": 1500, "iceChance": 0.11, "vineChance": 0.08 },
    { "name": "第七关 · 棋盘迷局", "colors": 5, "pattern": "checkerboard", "rows": 6, "density": 1.0, "dropRate": 5, "targetScore": 1800, "iceChance": 0.12, "vineChance": 0.088 },
    { "name": "第八关 · 十字星", "colors": 5, "pattern": "cross", "rows": 7, "density": 1.0, "dropRate": 4, "targetScore": 2000, "iceChance": 0.13, "vineChance": 0.096 },
    { "name": "第九关 · 倒三角", "colors": 5, "pattern": "vshape", "rows": 8, "density": 1.0, "dropRate": 4, "targetScore": 2500, "iceChance": 0.14, "vineChance": 0.104 },
    { "name": "第十关 · 终极挑战", "colors": 6, "pattern": "scattered", "rows": 8, "density": 0.7, "dropRate": 4, "targetScore": 3000, "iceChance": 0.14, "vineChance": 0.112 }
  ],
  "endless": {
    "baseColors": 3,
    "colorStepEvery": 2,
    "maxColors": 7,
    "baseRows": 4,
    "rowStepEvery": 2,
    "maxRows": 10,
    "baseDensity": 0.3,
    "densityStep": 0.04,
    "maxDensity": 0.9,
    "baseDropRate": 6,
    "dropStepEvery": 5,
    "minDropRate": 3,
    "baseTargetScore": 1000,
    "targetScorePerLevel": 500,
    "patterns": ["scattered", "rows", "triangle", "checkerboard", "ring", "cross", "vshape", "diamond"],
    "iceChanceBase": 0.06,
    "iceChanceStep": 0.01,
    "iceChanceMax": 0.14,
    "vineChanceBase": 0.04,
    "vineChanceStep": 0.008,
    "vineChanceMax": 0.12
  }
}
</script>

<script src="bubble-pop.js"></script>
</body>
</html>
