<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>肉鸽打怪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a14;display:flex;justify-content:center;align-items:center;
  height:100vh;overflow:hidden;touch-action:none;user-select:none;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
}
#game{
  position:relative;
  width:min(100vw,420px);height:min(100vh,850px);
  overflow:hidden;
}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hud{
  position:absolute;top:8px;left:8px;right:8px;
  display:flex;flex-wrap:wrap;gap:4px;z-index:10;
}
.hud-item{
  background:rgba(0,0,0,.65);color:#fff;padding:4px 10px;
  border-radius:10px;font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:4px;
}
.hud-item .icon{font-size:15px}
#skill-panel{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.8);display:none;flex-direction:column;
  justify-content:center;align-items:center;z-index:50;
  pointer-events:auto;
}
#skill-title{
  color:#ffd700;font-size:22px;font-weight:900;margin-bottom:6px;
  text-shadow:0 0 20px rgba(255,215,0,.5);
}
#skill-sub{color:#aaa;font-size:13px;margin-bottom:16px}
#skill-cards{
  display:flex;flex-direction:column;gap:10px;width:85%;max-width:340px;
}
.skill-card{
  background:linear-gradient(135deg,#1a1a3e,#0d0d2b);border:2px solid #2a2a5e;
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:.2s;
  display:flex;align-items:center;gap:12px;
}
.skill-card:hover,.skill-card:active{
  border-color:#ffd700;background:linear-gradient(135deg,#2a2a5e,#1a1a4e);
  transform:scale(1.03);
}
.skill-icon{font-size:36px;flex-shrink:0}
.skill-info h4{color:#fff;font-size:14px;margin-bottom:2px}
.skill-info p{color:#aaa;font-size:11px;line-height:1.4}
.skill-lv{color:#ffd700;font-size:11px;margin-left:6px}
#game-over{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.85);display:none;flex-direction:column;
  justify-content:center;align-items:center;z-index:60;
  pointer-events:auto;
}
#game-over h2{color:#e74c3c;font-size:28px;margin-bottom:12px}
#game-over .stats{color:#fff;font-size:14px;text-align:center;line-height:2;margin-bottom:20px}
#game-over .stat-v{color:#ffd700;font-weight:700}
#restart-btn{
  background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:none;
  padding:12px 40px;font-size:16px;font-weight:700;border-radius:25px;
  cursor:pointer;transition:.2s;
}
#restart-btn:hover,#restart-btn:active{transform:scale(1.08)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="hud-item"><span class="icon">❤️</span><span id="hp-txt">100</span></div>
      <div class="hud-item"><span class="icon">🌊</span><span id="wave-txt">1</span></div>
      <div class="hud-item"><span class="icon">💰</span><span id="gold-txt">0</span></div>
      <div class="hud-item"><span class="icon">💀</span><span id="kill-txt">0</span></div>
      <div class="hud-item" style="background:rgba(255,215,0,.15)"><span class="icon">🏷️</span><span id="ver-txt">v1.5.0</span></div>
    </div>
    <div id="skill-panel">
      <div id="skill-title">🔮 选择升级</div>
      <div id="skill-sub">选择一个技能提升实力</div>
      <div id="skill-cards"></div>
    </div>
    <div id="game-over">
      <h2>💀 游戏结束</h2>
      <div class="stats">
        <div>生存波次: <span class="stat-v" id="end-wave">1</span></div>
        <div>击败敌人: <span class="stat-v" id="end-kill">0</span></div>
        <div>获得金币: <span class="stat-v" id="end-gold">0</span></div>
      </div>
      <button id="restart-btn">再来一局</button>
    </div>
  </div>
</div>
<script>
"use strict";
const W=420,H=800,PI=Math.PI;
const c=document.getElementById("c"),ctx=c.getContext("2d");
c.width=W;c.height=H;
const dpr=Math.min(window.devicePixelRatio||1,2);
c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);

const R=id=>document.getElementById(id),rand=(a,b)=>Math.random()*(b-a)+a;
const randi=(a,b)=>Math.floor(rand(a,b+1));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

let G,PL,monsters,bullets,particles,golds,dmgNums,pets;
let spawnTimer,attackTimer,gameLoop,skillGoldBase,nextSkillGold;
let skillPanelShown=false,paused=false;
let waveAnnounce=null,screenFlash=0,screenShake=0;
const VERSION='v1.5.0';

// ========== ENEMY TYPES ==========
const MONSTERS={
  slime:{emoji:"🟢",name:"史莱姆",hp:40,atk:4,spd:.5,s:20,gold:12,c:"#4ade80",element:"nature",shootRange:0,shootCD:99,projEmoji:"",projSpd:0},
  bat:{emoji:"🦇",name:"蝙蝠",hp:18,atk:7,spd:1.6,s:14,gold:14,c:"#a78bfa",element:"lightning",shootRange:200,shootCD:1.8,projEmoji:"💨",projSpd:3},
  goblin:{emoji:"👹",name:"哥布林",hp:35,atk:10,spd:.9,s:18,gold:20,c:"#f87171",element:"fire",shootRange:220,shootCD:2,projEmoji:"🗡️",projSpd:2.5},
  skeleton:{emoji:"💀",name:"骷髅兵",hp:60,atk:18,spd:.45,s:22,gold:28,c:"#d4d4d8",element:"ice",shootRange:250,shootCD:2.5,projEmoji:"🦴",projSpd:2},
  mage:{emoji:"🧙",name:"暗法师",hp:30,atk:22,spd:.35,s:18,gold:35,c:"#e879f9",element:"lightning",range:180,shootRange:280,shootCD:1.5,projEmoji:"🔮",projSpd:2.5}
};

const BOSS_TYPES=[
  {key:'wolf',emoji:'🐺',name:'狼王',hp:150,atk:12,spd:1.2,s:26,gold:60,c:'#94a3b8',minWave:1,demoteWave:5,element:'lightning',
   ability:'speed',abilityName:'疾风',shootRange:250,shootCD:1.2,projEmoji:'⚡',projSpd:3},
  {key:'orc',emoji:'🧌',name:'兽人',hp:300,atk:28,spd:.6,s:28,gold:80,c:'#f97316',minWave:5,demoteWave:10,element:'fire',
   ability:'power',abilityName:'狂暴',shootRange:260,shootCD:1.8,projEmoji:'🪓',projSpd:2.5},
  {key:'dragon',emoji:'🐉',name:'暗龙',hp:500,atk:30,spd:.5,s:32,gold:130,c:'#6366f1',minWave:10,demoteWave:16,element:'fire',
   ability:'fireAura',abilityName:'烈焰',range:200,shootRange:300,shootCD:1.2,projEmoji:'🔥',projSpd:2.5},
  {key:'demon',emoji:'👑',name:'魔王',hp:1000,atk:40,spd:.4,s:38,gold:260,c:'#dc2626',minWave:16,demoteWave:999,element:'ice',
   ability:'freeze',abilityName:'寒冰',shootRange:350,shootCD:1,projEmoji:'💀',projSpd:3}
];

// ========== SKILLS ==========
const SKILLS={
  multishot:{name:"多重射击",emoji:"🎯",desc:"同时发射 {n} 发子弹",maxLv:4,base:1,apply(p){p.multi+=1}},
  atkspd:{name:"急速攻击",emoji:"⚡",desc:"攻击速度 +{n}%",maxLv:5,base:1,apply(p){p.atkSpdBonus+=.2}},
  damage:{name:"力量强化",emoji:"💪",desc:"攻击力 +{n}%",maxLv:5,base:1,apply(p){p.dmgBonus+=.25}},
  pierce:{name:"穿透箭",emoji:"🏹",desc:"子弹穿透 +{n} 个敌人",maxLv:3,base:1,apply(p){p.pierce+=1}},
  explosive:{name:"爆炸弹",emoji:"💥",desc:"子弹命中时爆炸，范围 {n}",maxLv:4,base:0,apply(p){p.explosive=(p.explosive||0)+1}},
  crit:{name:"致命一击",emoji:"🗡️",desc:"暴击率 +{n}%",maxLv:5,base:1,apply(p){p.critChance+=.12}},
  knockback:{name:"击退之力",emoji:"🛡️",desc:"击退敌人 {n} 格",maxLv:4,base:0,apply(p){p.knockback=(p.knockback||0)+5}},
  summon:{name:"召唤宝宝",emoji:"🐾",desc:"召唤 {n} 只战斗宝宝",maxLv:4,base:0,apply(p){p.summonCount=(p.summonCount||0)+1}},
  freeze:{name:"冰霜弹",emoji:"❄️",desc:"{n}% 几率减速敌人",maxLv:4,base:1,apply(p){p.freezeChance+=.18}},
  poison:{name:"剧毒",emoji:"☠️",desc:"击中附加 {n} 秒中毒",maxLv:4,base:0,apply(p){p.poisonDot=(p.poisonDot||0)+1.5}},
  heal:{name:"生命汲取",emoji:"🩸",desc:"击杀回复 {n}% HP",maxLv:4,base:0,apply(p){p.vampire=(p.vampire||0)+.05}},
  chain:{name:"连锁闪电",emoji:"⚡",desc:"{n}% 几率连锁2个敌人",maxLv:4,base:0,apply(p){p.chainChance=(p.chainChance||0)+.2}},
  maxHp:{name:"生命上限",emoji:"❤️",desc:"最大生命 +{n}%",maxLv:5,base:1,apply(p){p.maxHpBonus+=.3}},
  movespd:{name:"移速提升",emoji:"👟",desc:"移动速度 +{n}%",maxLv:4,base:1,apply(p){p.spdBonus+=.25}},
  gold:{name:"淘金术",emoji:"🪙",desc:"金币掉落 +{n}%",maxLv:4,base:1,apply(p){p.goldBonus+=.35}},
  regen:{name:"自然回复",emoji:"💚",desc:"每秒回复 {n}% HP",maxLv:3,base:1,apply(p){p.regen=(p.regen||0)+.01}},
  magnet:{name:"金币磁铁",emoji:"🧲",desc:"拾取范围 +{n}%",maxLv:4,base:1,apply(p){p.magnetRange+=.4}}
};

function getSkillLevel(p,key){return p.skills[key]||0}

function initPlayer(){
  return{
    x:W/2,y:H-120,r:20,
    hp:100,maxHp:100,atk:15,atkSpeed:1,atkRange:900,
    multi:1,pierce:0,explosive:0,critChance:0,critDmg:2.5,
    dmgBonus:1,atkSpdBonus:1,
    magnetRange:1,poisonDot:0,freezeChance:0,vampire:0,chainChance:0,
    maxHpBonus:1,spdBonus:1,goldBonus:1,regen:0,gold:0,
    knockback:0,summonCount:0,
    skills:{},dragX:null,
    _freezeDebuff:0
  }
}

function initGame(){
  PL=initPlayer();monsters=[];bullets=[];particles=[];golds=[];
  dmgNums=[];pets=[];
  G={wave:1,kills:0,score:0,time:0,totalGold:0,waveSpawned:0,bossSpawned:false,bossCount:0};
  spawnTimer=0;attackTimer=0;skillGoldBase=30;nextSkillGold=skillGoldBase;
  skillPanelShown=false;paused=false;waveAnnounce={text:'第1波',timer:90};
  screenFlash=0;screenShake=0;
  R('skill-panel').style.display='none';R('game-over').style.display='none';
  updateHUD();
}

function updateHUD(){
  R('hp-txt').textContent=Math.ceil(PL.hp);
  R('wave-txt').textContent=G.wave;
  R('gold-txt').textContent=PL.gold;
  R('kill-txt').textContent=G.kills;
}

// ========== GAME LOGIC ==========
function getWaveMonsterCount(){return 4+Math.floor(G.wave*1.2)}
function getSpawnInterval(){return Math.max(300,1600-G.wave*60)}

function getMonsterTier(){
  let r=Math.random(),w=G.wave;
  let demoted=BOSS_TYPES.filter(b=>w>=b.demoteWave);
  if(demoted.length>0&&r<.04*Math.min(demoted.length,3)){
    return demoted[randi(0,demoted.length-1)];
  }
  if(r<.25)return'slime';
  if(r<.5)return'bat';
  if(r<.7)return'goblin';
  if(r<.85)return'skeleton';
  if(r<.95)return'mage';
  return'skeleton';
}

function getEnemySkills(wave){
  let es={slowAura:false,knockback:false,poison:false};
  if(wave>=4&&Math.random()<.15)es.slowAura=true;
  if(wave>=6&&Math.random()<.12)es.knockback=true;
  if(wave>=9&&Math.random()<.1)es.poison=true;
  return es;
}

function getBossColorVariant(baseColor,wave){
  let variants=['#ff6b6b','#f472b6','#c084fc','#818cf8','#38bdf8','#34d399'];
  let cycle=Math.floor((wave-1)/4);
  return variants[cycle%variants.length];
}

function spawnRegularMonster(){
  let tier=getMonsterTier();
  let base,s=1+G.wave*.15;
  let isBossTier=false;
  if(typeof tier==='object'){
    base=tier;isBossTier=true;s*=.4;
  }else{
    base=MONSTERS[tier];
    if(tier==='mage')s*=1.15;
  }
  let mx=rand(40,W-40),my=rand(-60,-10);
  let hp=Math.round(base.hp*s);
  let atk=Math.round(base.atk*s);
  let gold=Math.round(base.gold*s);
  let spd=base.spd*Math.min(1+G.wave*.04,2.5);
  let es=isBossTier?{slowAura:false,knockback:false,poison:false}:getEnemySkills(G.wave);
  let elem=base.element||'fire';
  monsters.push({
    emoji:base.emoji,name:base.name,
    hp:hp,maxHp:hp,atk:atk,spd:spd,
    gold:gold,s:base.s,
    x:mx,y:my,boss:false,r:base.s,
    c:base.c,element:elem,
    range:base.range||0,
    shootRange:base.shootRange||0,shootCD:base.shootCD||99,
    projEmoji:base.projEmoji||"",projSpd:base.projSpd||0,
    poisonTimer:0,freezeTimer:0,hitFlash:0,
    wobble:rand(0,PI*2),
    slowAura:es.slowAura,knockback:es.knockback,poisonSpit:es.poison,
    ability:null,_shootTimer:rand(0,1)
  });
}

function spawnWaveBoss(){
  let available=BOSS_TYPES.filter(b=>b.minWave<=G.wave);
  let bossDef=available[available.length-1];
  let s=1+G.wave*.15;
  let hp=Math.round(bossDef.hp*s*2.5);
  let atk=Math.round(bossDef.atk*s*1.8);
  let gold=Math.round(bossDef.gold*s*1.5);
  let colorVariant=getBossColorVariant(bossDef.c,G.wave);
  let nameSuffix=G.wave>=bossDef.demoteWave?'·强化':'';
  let elem=bossDef.element||'fire';

  monsters.push({
    emoji:bossDef.emoji,name:bossDef.name+nameSuffix,
    hp:hp,maxHp:hp,atk:atk,spd:bossDef.spd,
    gold:gold,s:bossDef.s,
    x:W/2,y:-50,r:bossDef.s,
    c:colorVariant,boss:true,element:elem,
    range:bossDef.range||0,
    shootRange:bossDef.shootRange||200,shootCD:bossDef.shootCD||2,
    projEmoji:bossDef.projEmoji||"💀",projSpd:bossDef.projSpd||4,
    poisonTimer:0,freezeTimer:0,hitFlash:0,
    wobble:rand(0,PI*2),
    slowAura:G.wave>=5,knockback:G.wave>=8,poisonSpit:G.wave>=10,
    ability:bossDef.ability,_shootTimer:rand(0,1),
    _fireAuraTimer:0,_freezeTimer:0
  });

  G.bossCount=1;
  if(G.wave>=10&&G.wave%5===0){
    let secondBoss=available.length>1?available[available.length-2]:available[0];
    let s2=1+G.wave*.15;
    let hp2=Math.round(secondBoss.hp*s2*2);
    let atk2=Math.round(secondBoss.atk*s2*1.5);
    let gold2=Math.round(secondBoss.gold*s2*1.2);
    let c2=getBossColorVariant(secondBoss.c,G.wave+3);
    monsters.push({
      emoji:secondBoss.emoji,name:secondBoss.name+'·强化',
      hp:hp2,maxHp:hp2,atk:atk2,spd:secondBoss.spd*1.2,
      gold:gold2,s:secondBoss.s,
      x:W/4,y:-50,r:secondBoss.s,
      c:c2,boss:true,element:secondBoss.element||'fire',
      range:secondBoss.range||0,
      shootRange:secondBoss.shootRange||200,shootCD:secondBoss.shootCD||2,
      projEmoji:secondBoss.projEmoji||"💀",projSpd:secondBoss.projSpd||4,
      poisonTimer:0,freezeTimer:0,hitFlash:0,
      wobble:rand(0,PI*2),
      slowAura:true,knockback:G.wave>=8,poisonSpit:false,
      ability:secondBoss.ability,_shootTimer:rand(0,1),
      _fireAuraTimer:0,_freezeTimer:0
    });
    G.bossCount=2;
  }
  waveAnnounce={text:G.bossCount>1?'⚠️ 双BOSS来袭':'⚠️ BOSS来袭',timer:100};
}

// ---- PETS ----
function spawnPets(count){
  for(let i=0;i<count;i++){
    let ang=PI*2*i/count;
    pets.push({
      x:PL.x+Math.cos(ang)*30,
      y:PL.y+Math.sin(ang)*30,
      hp:40+G.wave*5,maxHp:40+G.wave*5,
      atk:Math.round(PL.atk*.4),spd:3,
      s:12,life:15+getSkillLevel(PL,'summon')*5,
      shootTimer:0,shootInterval:1.2,
      emoji:['🐕','🐈','🐉','🦅'][i%4],
      c:'#60a5fa'
    });
  }
}

function updatePets(dt){
  for(let i=pets.length-1;i>=0;i--){
    let p=pets[i];
    p.life-=dt;
    if(p.life<=0){spawnParticles(p.x,p.y,6,'#60a5fa');pets.splice(i,1);continue}
    let dx=PL.x-p.x,dy=PL.y-p.y,d=Math.hypot(dx,dy);
    if(d>50){p.x+=dx/d*p.spd;p.y+=dy/d*p.spd}
    else if(d>20){p.x+=dx/d*p.spd*.3;p.y+=dy/d*p.spd*.3}
    p.shootTimer+=dt;
    if(p.shootTimer>=p.shootInterval){
      let nearest=null,minD=300;
      for(let m of monsters){
        if(m.projectile)continue;
        let dd=dist(p,m);
        if(dd<minD){minD=dd;nearest=m}
      }
      if(nearest){
        p.shootTimer=0;
        let ang=Math.atan2(nearest.y-p.y,nearest.x-p.x);
        bullets.push({
          x:p.x,y:p.y-6,
          vx:Math.cos(ang)*6,vy:Math.sin(ang)*6,
          dmg:p.atk,pierce:0,hit:new Set(),explosive:0,
          poison:0,freeze:0,crit:false,
          isPet:true,elem:null,
          cx:p.x,cy:p.y-6,
          trail:[]
        });
        spawnParticles(p.x,p.y,2,'#60a5fa');
      }
    }
    for(let j=monsters.length-1;j>=0;j--){
      let m=monsters[j];
      if(m.projectile)continue;
      if(dist(p,m)<p.s+m.s){
        p.hp-=m.atk*dt;
        if(p.hp<=0){spawnParticles(p.x,p.y,8,'#60a5fa');pets.splice(i,1);break}
      }
    }
  }
}

function findNearestMonster(){
  let best=null,bestD=Infinity;
  for(let m of monsters){
    if(m.projectile)continue;
    let d=dist(PL,m);
    if(d<bestD){bestD=d;best=m}
  }
  return best;
}

// ---- SHOOTING ----
function shoot(){
  let ang=-PI/2;
  let crit=Math.random()<PL.critChance;
  for(let i=0;i<PL.multi;i++){
    let spread=i===0?0:(i%2?1:-1)*Math.ceil(i/2)*.12;
    let a=ang+spread;
    let isCrit=crit&&i===0;
    let critMult=isCrit?(PL.critDmg||2.5):1;
    bullets.push({
      x:PL.x,y:PL.y-10,
      vx:Math.cos(a)*10,vy:Math.sin(a)*10,
      dmg:PL.atk*PL.dmgBonus*critMult,
      pierce:PL.pierce,hit:new Set(),explosive:PL.explosive,
      poison:PL.poisonDot,freeze:PL.freezeChance,
      crit:isCrit,isPet:false,
      cx:PL.x,cy:PL.y-10,
      trail:[]
    });
  }
}

function hitMonster(bullet,monster,idx){
  if(bullet.hit.has(idx))return false;
  bullet.hit.add(idx);

  let dmg=Math.round(bullet.dmg);
  monster.hp-=dmg;monster.hitFlash=8;
  spawnDamageNum(monster.x,monster.y,dmg,bullet.crit);

  if(bullet.crit){
    screenFlash=5;screenShake=4;
    for(let i=0;i<12;i++){
      particles.push({x:monster.x+rand(-15,15),y:monster.y+rand(-15,15),
        vx:rand(-4,4),vy:rand(-5,-1),life:rand(15,35),maxLife:35,
        color:Math.random()>.5?'#ffd700':'#ffaa00'});
    }
    dmgNums.push({x:monster.x+rand(-5,5),y:monster.y-30,v:'暴击!',crit:true,life:0});
    spawnParticles(monster.x,monster.y,6,'#ffd700');
  }else{
    spawnParticles(monster.x,monster.y,4,'#ff6b6b');
  }

  if(PL.knockback>0&&!bullet.isPet){
    let kbAng=Math.atan2(monster.y-PL.y,monster.x-PL.x);
    monster.x+=Math.cos(kbAng)*PL.knockback;
    monster.y+=Math.sin(kbAng)*PL.knockback;
    monster.x=clamp(monster.x,monster.s,W-monster.s);
    monster.y=clamp(monster.y,-H*.1,H);
  }

  if(bullet.poison>0){monster.poisonTimer=Math.max(monster.poisonTimer||0,bullet.poison*60)}
  if(Math.random()<bullet.freeze)monster.freezeTimer=90;

  if(bullet.explosive>0){
    for(let i=monsters.length-1;i>=0;i--){
      let m=monsters[i];if(m===monster)continue;
      if(dist(monster,m)<bullet.explosive*45){spawnParticles(m.x,m.y,3,'#fbbf24');m.hp-=Math.round(dmg*.4);m.hitFlash=8}
    }
    spawnParticles(monster.x,monster.y,8,'#fbbf24');
  }

  if(Math.random()<PL.chainChance){
    let candidates=monsters.filter((m,i)=>{if(!bullet.hit.has(i)&&m!==monster)return dist(monster,m)<150;return false});
    if(candidates.length>0){
      let ct=candidates.sort((a,b)=>dist(monster,a)-dist(monster,b)).slice(0,2);
      for(let cm of ct){
        let ci=monsters.indexOf(cm);
        if(ci>=0&&!bullet.hit.has(ci)){bullet.hit.add(ci);cm.hp-=Math.round(dmg*.5);cm.hitFlash=8;spawnParticles(cm.x,cm.y,3,'#a78bfa')}
      }
    }
  }
  if(monster.hp<=0)killMonster(monster);
  return monster.hp<=0||bullet.pierce<0;
}

function killMonster(m){
  spawnParticles(m.x,m.y,10,m.c);
  spawnGold(m.x,m.y,Math.round(m.gold*PL.goldBonus));
  G.kills++;
  if(PL.vampire>0)PL.hp=Math.min(PL.maxHp,PL.hp+Math.round(PL.maxHp*PL.vampire));
  let idx=monsters.indexOf(m);if(idx>=0)monsters.splice(idx,1);
}

function spawnGold(x,y,amt){
  let count=Math.min(Math.floor(amt/5),6);
  if(count<1)count=1;
  for(let i=0;i<count;i++){
    let gv=Math.ceil(amt/count);
    golds.push({x:x+rand(-10,10),y:y+rand(-10,10),v:gv,vy:-rand(1,3),life:180});
  }
}

function spawnParticles(x,y,n,color){
  for(let i=0;i<n;i++)
    particles.push({x,y,vx:rand(-2,2),vy:rand(-3,-1),life:rand(15,30),maxLife:30,color});
}

function spawnDamageNum(x,y,dmg,crit){
  dmgNums.push({x:x+rand(-10,10),y:y-10,v:Math.round(dmg),crit:!!crit,life:0});
}

function collectGold(){
  let magRange=100*PL.magnetRange;
  for(let i=golds.length-1;i>=0;i--){
    let g=golds[i];g.life--;g.vy+=.15;g.y+=g.vy;
    if(g.life<=0||g.y>H+50){golds.splice(i,1);continue}
    let d=dist(PL,g);
    if(d<magRange){g.x-=(g.x-PL.x)*.15;g.y-=(g.y-PL.y)*.15}
    if(d<PL.r+12){PL.gold+=g.v;G.totalGold+=g.v;golds.splice(i,1)}
  }
}

function checkSkillPanel(){
  if(skillPanelShown||paused)return;
  if(PL.gold>=nextSkillGold){
    skillPanelShown=true;paused=true;
    showSkillPanel();
  }
}

function getRandomSkills(n=3){
  let pool=Object.keys(SKILLS).filter(k=>getSkillLevel(PL,k)<SKILLS[k].maxLv);
  if(pool.length===0)pool=Object.keys(SKILLS);
  let result=[];
  let remaining=n;
  for(let i=0;i<remaining;i++){
    let filtered=pool.filter(k=>!result.includes(k));
    if(filtered.length===0)break;
    let idx=randi(0,filtered.length-1);
    result.push(filtered[idx]);
  }
  return result.slice(0,n);
}

function calcSkillDesc(key,lv){
  let s=SKILLS[key];
  if(key==='explosive')return Math.round(lv*1.2);
  if(key==='poison')return Math.round(lv*1.5);
  if(key==='vampire'||key==='regen')return Math.round(lv*100)+'%';
  if(key==='chain'||key==='freeze')return Math.round(lv*18)+'%';
  if(key==='crit')return Math.round(lv*12)+'%';
  if(key==='knockback')return lv*5;
  if(key==='summon')return lv;
  return s.base+lv;
}

function showSkillPanel(){
  let panel=R('skill-panel'),cards=R('skill-cards');
  panel.style.display='flex';cards.innerHTML='';

  R('skill-title').textContent='🔮 选择升级';
  R('skill-sub').textContent='选择一个技能提升实力';
  let skills=getRandomSkills(3);
  for(let key of skills){
    let s=SKILLS[key],lv=getSkillLevel(PL,key)+1;
    let descStr=calcSkillDesc(key,lv);
    let desc=s.desc.replace('{n}',descStr);
    let div=document.createElement('div');
    div.className='skill-card';
    div.innerHTML=`<div class="skill-icon">${s.emoji}</div><div class="skill-info"><h4>${s.name}<span class="skill-lv">Lv.${lv}/${s.maxLv}</span></h4><p>${desc}</p></div>`;
    div.onclick=()=>pickSkill(key);
    cards.appendChild(div);
  }
}

function pickSkill(key){
  PL.skills[key]=(PL.skills[key]||0)+1;
  SKILLS[key].apply(PL);
  PL.gold-=Math.round(nextSkillGold);
  skillGoldBase+=10;
  nextSkillGold=skillGoldBase*Math.pow(1.08,skillGoldBase/30-1)+skillGoldBase;
  R('skill-panel').style.display='none';
  skillPanelShown=false;paused=false;
  if(PL.hp<PL.maxHp)PL.hp=Math.min(PL.maxHp,PL.hp+20);
  if(key==='summon')spawnPets(PL.summonCount);
  // Update maxHp after bonus changes
  PL.maxHp=Math.round(100*PL.maxHpBonus);
  updateHUD();
}

function gameOver(){
  paused=true;skillPanelShown=true;
  R('game-over').style.display='flex';
  R('end-wave').textContent=G.wave;R('end-kill').textContent=G.kills;R('end-gold').textContent=G.totalGold;
}

function update(dt){
  if(paused)return;
  dt=Math.min(dt,.1);G.time+=dt;

  // Regen
  if(PL.regen>0&&PL.hp<PL.maxHp)PL.hp=Math.min(PL.maxHp,PL.hp+PL.maxHp*PL.regen*dt);

  // Auto attack
  attackTimer+=dt;
  if(attackTimer>=1/(PL.atkSpeed*PL.atkSpdBonus)){
    attackTimer=0;
    if(monsters.some(m=>!m.projectile))shoot();
  }

  // Pets
  updatePets(dt);

  // Spawn
  spawnTimer+=dt;
  let spawnInt=getSpawnInterval()/1000;
  if(!G.bossSpawned&&spawnTimer>=spawnInt&&G.waveSpawned<getWaveMonsterCount()){
    spawnTimer=0;spawnRegularMonster();G.waveSpawned++;
  }

  if(!G.bossSpawned&&G.waveSpawned>=getWaveMonsterCount()&&!monsters.some(m=>!m.boss&&!m.projectile)){
    spawnWaveBoss();G.bossSpawned=true;
  }

  if(G.bossSpawned&&monsters.length===0&&spawnTimer>1.5){
    G.wave++;G.waveSpawned=0;G.bossSpawned=false;G.bossCount=0;spawnTimer=0;
    waveAnnounce={text:'第'+G.wave+'波',timer:90};
    updateHUD();
  }

  let playerSpdMult=1;

  // Update monsters
  for(let i=monsters.length-1;i>=0;i--){
    let m=monsters[i];
    if(m.projectile){
      m.x+=m.vx;m.y+=m.vy;m.life--;
      // Bigger and brighter trail
      for(let t=0;t<3;t++)particles.push({x:m.x+rand(-4,4),y:m.y+rand(-4,4),vx:rand(-.8,.8),vy:rand(-.8,.8),life:15,maxLife:15,color:m.c});
      // White core trail
      particles.push({x:m.x,y:m.y,vx:0,vy:0,life:6,maxLife:6,color:'#fff'});
      if(m.life<=0||m.x<-30||m.x>W+30||m.y<-30||m.y>H+30){monsters.splice(i,1);continue}
      let pd=dist(m,PL);if(pd<PL.r+m.s){
        let pdmg=Math.round(m.atk);
        PL.hp-=pdmg;
        spawnDamageNum(PL.x,PL.y-20,pdmg,false);
        spawnParticles(PL.x,PL.y,8,'#e879f9');
        screenFlash=8;screenShake=6;
        monsters.splice(i,1);continue
      }else continue}

    m.wobble+=dt*4;
    if(m.freezeTimer>0){m.freezeTimer-=1;continue}
    if(m.poisonTimer>0){
      m.poisonTimer-=1;
      if(Math.floor(m.poisonTimer)%30===0){m.hp-=Math.round(PL.poisonDot*2);spawnDamageNum(m.x,m.y,Math.round(PL.poisonDot*2),false)}
      if(m.hp<=0){killMonster(m);continue}
    }
    if(m.hitFlash>0)m.hitFlash--;

    // Boss abilities
    if(m.boss){
      if(m.ability==='speed'){m.spd=1.2+Math.sin(G.time*2)*.4}
      if(m.ability==='fireAura'){
        m._fireAuraTimer+=dt;
        if(m._fireAuraTimer>.8){
          m._fireAuraTimer=0;
          if(dist(m,PL)<70){
            PL.hp-=Math.round(m.atk*.3);
            spawnParticles(PL.x,PL.y,5,'#ff6b35');
            spawnDamageNum(PL.x,PL.y-20,Math.round(m.atk*.3),false);
            screenFlash=Math.max(screenFlash,2);
          }
          for(let fi=0;fi<3;fi++){
            let fa=rand(0,PI*2),fr=rand(20,40);
            particles.push({x:m.x+Math.cos(fa)*fr,y:m.y+Math.sin(fa)*fr,vx:rand(-1,1),vy:rand(-2,0),life:20,maxLife:20,color:'#ff6b35'});
          }
        }
      }
      if(m.ability==='freeze'){
        m._freezeTimer+=dt;
        if(m._freezeTimer>4&&dist(m,PL)<100){
          m._freezeTimer=0;
          PL._freezeDebuff=3;
          spawnParticles(PL.x,PL.y,10,'#93c5fd');
          dmgNums.push({x:PL.x,y:PL.y-30,v:'❄️冻结!',crit:false,life:0,elemText:true});
        }
      }
    }

    if(PL._freezeDebuff>0){
      PL._freezeDebuff-=dt;
      playerSpdMult=Math.min(playerSpdMult,.2);
    }
    if(m.slowAura&&dist(m,PL)<80)playerSpdMult=Math.min(playerSpdMult,.5);

    let dx=PL.x-m.x,dy=PL.y-m.y,d=Math.hypot(dx,dy);
    if(m.shootRange>0&&d<m.shootRange){
      m._shootTimer+=dt;
      let cd=m.shootCD;
      if(m.ability==='speed')cd*=.7;
      if(m._shootTimer>cd){
        m._shootTimer=0;
        let ang=Math.atan2(PL.y-m.y,PL.x-m.x),sp=m.projSpd||2.5;
        let projEmoji=m.projEmoji||"🔮";
        let ps=m.boss?16:13;
        monsters.push({emoji:projEmoji,name:"弹幕",hp:1,maxHp:1,atk:m.atk,spd:sp,s:ps,x:m.x,y:m.y,boss:false,
          gold:0,c:m.c,element:m.element||null,poisonTimer:0,freezeTimer:0,hitFlash:0,wobble:0,projectile:true,
          vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:300});
        if(m.boss&&G.wave>=6){
          for(let bi=0;bi<2;bi++){
            let ba=ang+(bi===0?.35:-.35);
            monsters.push({emoji:projEmoji,name:"弹幕",hp:1,maxHp:1,atk:Math.round(m.atk*.6),spd:sp,s:13,x:m.x,y:m.y,boss:false,
              gold:0,c:m.c,element:m.element||null,poisonTimer:0,freezeTimer:0,hitFlash:0,wobble:0,projectile:true,
              vx:Math.cos(ba)*sp,vy:Math.sin(ba)*sp,life:300});
          }
        }
        // Muzzle flash - bright burst at shooter position
        spawnParticles(m.x,m.y,8,m.c);
        spawnParticles(m.x,m.y,5,'#fff');
        // Shoot line flash
        particles.push({x:m.x,y:m.y,vx:Math.cos(ang)*40,vy:Math.sin(ang)*40,life:8,maxLife:8,color:m.c});
      }
      if(d>100){m.x+=dx/d*m.spd*.2;m.y+=dy/d*m.spd*.2}
    }else if(d>m.s+PL.r){
      m.x+=dx/d*m.spd;m.y+=dy/d*m.spd;
    }else{
      let dmg=Math.round(m.atk*dt);
      if(m.ability==='power')dmg=Math.round(dmg*1.5);
      PL.hp-=dmg;
      if(dmg>0)spawnDamageNum(PL.x,PL.y-20,dmg,false);
      spawnParticles(PL.x,PL.y,4,'#ff4444');
      spawnParticles(PL.x,PL.y,3,'#fbbf24');
      screenFlash=Math.max(screenFlash,3);screenShake=Math.max(screenShake,3);
      if(m.knockback){
        let kbAng=Math.atan2(PL.y-m.y,PL.x-m.x);
        PL.x+=Math.cos(kbAng)*20;PL.y+=Math.sin(kbAng)*20;
        PL.x=clamp(PL.x,PL.r,W-PL.r);PL.y=clamp(PL.y,PL.r,H-PL.r);
      }
      if(PL.hp<=0){gameOver();return}
    }
    m.x=clamp(m.x,m.s,W-m.s);
    if(m.y>H+60){monsters.splice(i,1);continue}
  }

  // Update bullets
  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i];
    if(!b.isPet){b.trail.push({x:b.x,y:b.y});if(b.trail.length>5)b.trail.shift()}
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-40||b.y>H+20){bullets.splice(i,1);continue}
    let hit=false;
    for(let j=monsters.length-1;j>=0;j--){
      if(dist(b,monsters[j])<monsters[j].s+4){
        if(hitMonster(b,monsters[j],j)){hit=true;break}
      }
    }
    if(hit&&b.pierce<=0){bullets.splice(i,1);continue}
    if(hit){b.pierce--}
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];p.life--;p.x+=p.vx;p.y+=p.vy;
    if(p.life<=0)particles.splice(i,1);
  }

  collectGold();
  for(let i=dmgNums.length-1;i>=0;i--){
    let d=dmgNums[i];d.life++;
    if(d.life>50)dmgNums.splice(i,1);
  }

  checkSkillPanel();updateHUD();
}

function render(){
  ctx.clearRect(0,0,W,H);

  let needRestore=false;
  if(screenShake>0){
    ctx.save();needRestore=true;
    ctx.translate(rand(-screenShake,screenShake),rand(-screenShake,screenShake));
    screenShake=Math.max(0,screenShake-.5);
  }

  // Grid bg
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=.5;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // Particles
  for(let p of particles){
    let a=p.life/p.maxLife;
    ctx.globalAlpha=a;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,2*a,0,PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Gold
  for(let g of golds){
    ctx.font='14px serif';ctx.textAlign='center';
    ctx.fillText('🪙',g.x,g.y+5);
  }

  // Bullets
  for(let b of bullets){
    let col=b.crit?'#ffd700':b.isPet?'#60a5fa':'#ffdd57';
    let sz=b.crit?5:b.isPet?3:3.5;
    if(b.trail&&b.trail.length>1){
      for(let t=0;t<b.trail.length;t++){
        let a=(t+1)/b.trail.length*.5;
        ctx.globalAlpha=a;ctx.fillStyle=col;
        ctx.beginPath();ctx.arc(b.trail[t].x,b.trail[t].y,sz*(t/b.trail.length),0,PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    ctx.shadowColor=col;ctx.shadowBlur=b.crit?12:6;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(b.x,b.y,sz,0,PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(b.x,b.y,sz*.5,0,PI*2);ctx.fill();
  }

  // Pets
  for(let p of pets){
    ctx.save();ctx.translate(p.x,p.y);
    ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.emoji,0,0);
    let bw=20,bh=3;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(-bw/2,-14,bw,bh);
    let hpR=p.hp/p.maxHp;
    ctx.fillStyle=hpR>.5?'#60a5fa':'#3b82f6';
    ctx.fillRect(-bw/2,-14,bw*hpR,bh);
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='9px sans-serif';
    ctx.fillText(Math.ceil(p.life)+'s',0,-20);
    ctx.restore();
  }

  // Monsters
  for(let m of monsters){
    ctx.save();ctx.translate(m.x,m.y+Math.sin(m.wobble)*2);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,m.s*.7,m.s*.6,m.s*.15,0,0,PI*2);ctx.fill();
    if(m.boss){ctx.shadowColor=m.c;ctx.shadowBlur=20}
    if(m.projectile){ctx.shadowColor=m.c;ctx.shadowBlur=25}
    if(!m.projectile){
      let bw=m.s*2.2,bh=4;
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(-bw/2,-m.s-bh-4,bw,bh);
      let hpR=m.hp/m.maxHp;
      ctx.fillStyle=hpR>.5?'#4ade80':hpR>.25?'#fbbf24':'#ef4444';
      ctx.fillRect(-bw/2,-m.s-bh-4,bw*hpR,bh);
    }
    ctx.font=`${m.s*2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m.emoji,0,0);
    if(m.projectile){
      ctx.shadowBlur=0;
      // Bright glow circle
      ctx.fillStyle=m.c;ctx.globalAlpha=.3;
      ctx.beginPath();ctx.arc(0,0,m.s+8,0,PI*2);ctx.fill();
      ctx.globalAlpha=.15;
      ctx.beginPath();ctx.arc(0,0,m.s+14,0,PI*2);ctx.fill();
      ctx.globalAlpha=1;
      // Ring
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.globalAlpha=.5;
      ctx.beginPath();ctx.arc(0,0,m.s+2,0,PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }
    if(!m.projectile){
      ctx.shadowBlur=0;
      if(m.boss){
        ctx.fillStyle=m.c;ctx.font='bold 11px sans-serif';ctx.fillText(m.name,0,-m.s-14);
        if(m.ability){
          let abilityLabel={speed:'疾风',power:'狂暴',fireAura:'烈焰',freeze:'寒冰'}[m.ability];
          ctx.fillStyle='#fbbf24';ctx.font='9px sans-serif';
          ctx.fillText(abilityLabel,0,-m.s-26);
        }
      }
      let icons=[];
      if(m.shootRange>0){
        icons.push('🎯');
        // Charge indicator - arc showing shooting cooldown progress
        if(m._shootTimer!==undefined){
          let cd=m.shootCD;
          if(m.ability==='speed')cd*=.7;
          let prog=Math.min(m._shootTimer/cd,1);
          if(prog>.1){
            ctx.strokeStyle=m.c;ctx.lineWidth=3;ctx.globalAlpha=.7;
            ctx.beginPath();ctx.arc(0,-m.s-3,m.s*.6,-PI/2,-PI/2+PI*2*prog);ctx.stroke();
            ctx.globalAlpha=1;
          }
        }
      }
      if(m.slowAura)icons.push('❄️');
      if(m.knockback)icons.push('💨');
      if(m.poisonSpit)icons.push('☠️');
      if(icons.length>0){
        ctx.font='10px serif';
        ctx.fillText(icons.join(''),0,m.s+12);
      }
      if(m.poisonTimer>0){ctx.fillStyle='rgba(139,92,246,.6)';ctx.beginPath();ctx.arc(0,0,m.s+3,0,PI*2);ctx.fill()}
      if(m.freezeTimer>0){ctx.fillStyle='rgba(147,197,253,.4)';ctx.beginPath();ctx.arc(0,0,m.s+3,0,PI*2);ctx.fill()}
      if(m.hitFlash>0){ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(0,0,m.s+2,0,PI*2);ctx.fill()}
    }
    ctx.restore();
  }

  // Player
  {
    let p=PL;ctx.save();ctx.translate(p.x,p.y);
    if(PL._freezeDebuff>0){
      ctx.fillStyle='rgba(147,197,253,.25)';ctx.beginPath();ctx.arc(0,0,p.r+8,0,PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,p.r*.7,p.r*.55,p.r*.15,0,0,PI*2);ctx.fill();
    ctx.shadowColor='#60a5fa';ctx.shadowBlur=12;
    ctx.font='36px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🧝',0,-2);ctx.restore();
    let bw=p.r*2,bh=5;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(p.x-bw/2,p.y-p.r-bh-8,bw,bh);
    let hpR=p.hp/p.maxHp;
    ctx.fillStyle=hpR>.5?'#4ade80':hpR>.25?'#fbbf24':'#ef4444';
    ctx.fillRect(p.x-bw/2,p.y-p.r-bh-8,bw*hpR,bh);
  }

  // Damage numbers
  for(let d of dmgNums){
    let a=1-d.life/50;
    let isCritText=d.v==='暴击!';
    let isElemText=d.elemText;
    if(isElemText){
      ctx.fillStyle=`rgba(200,180,255,${a})`;
      ctx.font='12px bold sans-serif';
    }else{
      ctx.fillStyle=isCritText?`rgba(255,100,100,${a})`:d.crit?`rgba(255,215,0,${a})`:`rgba(255,255,255,${a})`;
      ctx.font=`${d.crit?(isCritText?20:18):14}px bold sans-serif`;
    }
    ctx.textAlign='center';
    ctx.shadowColor=d.crit?'#ffd700':'transparent';ctx.shadowBlur=d.crit?8:0;
    ctx.fillText(d.v+(d.crit&&!isCritText?'!':''),d.x,d.y-a*28);
    ctx.shadowBlur=0;
  }

  // Wave announcement
  if(waveAnnounce&&waveAnnounce.timer>0){
    waveAnnounce.timer--;
    let a=waveAnnounce.timer>70?1:waveAnnounce.timer/70;
    ctx.globalAlpha=a;
    ctx.fillStyle=waveAnnounce.text.includes('BOSS')?'#ef4444':'#ffd700';
    ctx.font='bold 26px sans-serif';ctx.textAlign='center';
    ctx.shadowColor=waveAnnounce.text.includes('BOSS')?'#ef4444':'#ffd700';ctx.shadowBlur=15;
    ctx.fillText(waveAnnounce.text,W/2,H/2-60);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  // Gold progress bar
  let progW=W-60,progH=4;
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(30,H-30,progW,progH);
  let progress=Math.min(PL.gold/nextSkillGold,1);
  ctx.fillStyle='#ffd700';
  let grad=ctx.createLinearGradient(30,0,30+progW*progress,0);
  grad.addColorStop(0,'#ffd700');grad.addColorStop(1,'#fbbf24');
  ctx.fillStyle=grad;ctx.fillRect(30,H-30,progW*progress,progH);
  ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('🔮 '+PL.gold+'/'+Math.round(nextSkillGold),W/2,H-34);

  // Active skills bar
  let skillKeys=Object.keys(PL.skills);
  if(skillKeys.length>0){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H-58,W,22);
    for(let i=0;i<skillKeys.length;i++){
      let key=skillKeys[i],sk=SKILLS[key];
      ctx.fillStyle='#fff';ctx.font='13px serif';
      ctx.fillText(sk.emoji+'Lv.'+PL.skills[key],10+i*60,H-42);
    }
  }

  // Version
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='10px sans-serif';ctx.textAlign='right';
  ctx.fillText(VERSION,W-8,H-62);ctx.textAlign='center';

  // Screen flash
  if(screenFlash>0){
    ctx.fillStyle=`rgba(255,0,0,${screenFlash*.04})`;
    ctx.fillRect(-20,-20,W+40,H+40);
    screenFlash-=.5;
  }

  if(needRestore)ctx.restore();
}

function gameFrame(ts){
  if(!G)return;
  let dt=lastTs?(ts-lastTs)/1000:.016;
  lastTs=ts;
  update(dt);render();gameLoop=requestAnimationFrame(gameFrame);
}
let lastTs=0;

// Input
c.addEventListener('pointerdown',e=>{
  if(paused||!G)return;
  let rect=c.getBoundingClientRect(),sx=W/rect.width,sy=H/rect.height;
  let tx=(e.clientX-rect.left)*sx,ty=(e.clientY-rect.top)*sy;
  PL.dragX=tx;
});

c.addEventListener('pointermove',e=>{
  if(paused||!G||PL.dragX===null)return;
  let rect=c.getBoundingClientRect(),sx=W/rect.width;
  let tx=(e.clientX-rect.left)*sx;
  let spdMult=1;
  if(PL._freezeDebuff>0)spdMult=.2;
  PL.x+=((clamp(tx,PL.r,W-PL.r)-PL.x)*.5*spdMult);
});

c.addEventListener('pointerup',e=>{
  if(paused||!G)return;
  if(PL.dragX!==null){PL.dragX=null;return}
});

R('restart-btn').addEventListener('click',()=>{
  cancelAnimationFrame(gameLoop);
  R('game-over').style.display='none';
  initGame();
  lastTs=0;
  gameLoop=requestAnimationFrame(gameFrame);
});

// Start game directly
initGame();
lastTs=0;
gameLoop=requestAnimationFrame(gameFrame);
</script>
